# Seeded failures for the benchmarks in docs/research/2026-10-26-tokens-compared-with-k8sgpt.md:
# five workloads that fail in five different ways, and, after them, three objects for D011, D012
# and D013 (added on 2026-10-29, not part of that benchmark; each gave its Warning event on kind,
# Kubernetes 1.36, on 2026-10-29, and the five workloads still got their Pods), and two
# Deployments for D006 and D005 at the end (added on 2026-10-29 for
# docs/research/2026-10-29-richer-context-measured.md). Apply them to a
# test cluster, never to one that runs anything you care about, and delete the namespace
# afterwards. busybox is pinned by the digest of its multi-architecture index; badimage names a tag
# that does not exist, on purpose.
apiVersion: v1
kind: Namespace
metadata: {name: kausa-test, labels: {purpose: kausa-seeded-failures}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: crasher, namespace: kausa-test}
spec:
  replicas: 2
  selector: {matchLabels: {app: crasher}}
  template:
    metadata: {labels: {app: crasher}}
    spec:
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "echo 'connect ECONNREFUSED 192.0.2.10:5432'; sleep 2; exit 1"]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: badimage, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: badimage}}
  template:
    metadata: {labels: {app: badimage}}
    spec:
      containers:
      - name: app
        image: busybox:no-such-tag-kausa
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: toobig, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: toobig}}
  template:
    metadata: {labels: {app: toobig}}
    spec:
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sleep", "3600"]
        resources: {requests: {cpu: 5m, memory: 512Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: oom, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom}}
  template:
    metadata: {labels: {app: oom}}
    spec:
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "head -c 64m /dev/zero | tail > /dev/null"]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 16Mi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: failing-job, namespace: kausa-test}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: task
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "echo 'report failed: disk full'; exit 3"]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
# D011: a quota that admits no BestEffort Pod. Only Pods without requests or limits are BestEffort,
# so the five workloads above, which all set requests, are not affected; the ReplicaSet of
# cannot-create keeps writing FailedCreate ("exceeded quota: no-best-effort").
apiVersion: v1
kind: ResourceQuota
metadata: {name: no-best-effort, namespace: kausa-test}
spec:
  hard: {pods: "0"}
  scopes: [BestEffort]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cannot-create, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: cannot-create}}
  template:
    metadata: {labels: {app: cannot-create}}
    spec:
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sleep", "3600"]
---
# D012: a claim whose StorageClass does not exist; the PersistentVolume controller keeps writing
# ProvisioningFailed on it. No Pod uses it, so it raises no D005.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: no-class, namespace: kausa-test}
spec:
  storageClassName: kausa-no-such-class
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Mi}}
---
# D013: an autoscaler whose target does not exist; the controller keeps writing FailedGetScale,
# whether or not the cluster serves the metrics API.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: no-target, namespace: kausa-test}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kausa-no-such-target}
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 80}}
---
# D006, added on 2026-10-29 for docs/research/2026-10-29-richer-context-measured.md: an HTTP
# readiness probe on a port nothing listens on, so the kubelet keeps writing Unhealthy. Its path is
# sent with the incident (docs/adr/0017-richer-context-for-the-model.md).
apiVersion: apps/v1
kind: Deployment
metadata: {name: unready, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: unready}}
  template:
    metadata: {labels: {app: unready}}
    spec:
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sleep", "3600"]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
        readinessProbe:
          httpGet: {path: /ready, port: 8080}
---
# D005 at the largest scheduling record kausa keeps (src/record.rs), added on 2026-10-29 with
# unready: 8 node selector keys, 8 required node affinity requirements, 4 required Pod affinity
# and 4 anti-affinity terms and 8 tolerations, each key 128 bytes long and invented. No node has
# the labels, so the Pod stays Pending.
apiVersion: apps/v1
kind: Deployment
metadata: {name: unplaceable, namespace: kausa-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: unplaceable}}
  template:
    metadata: {labels: {app: unplaceable}}
    spec:
      nodeSelector:
        "bench-selector-0yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-0-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-2-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-3yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-3-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-4yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-4-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-5yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-5-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-6yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-6-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
        "bench-selector-7yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/selector-7-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx": "v"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: "bench-affinity-0yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-0-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-2-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-3yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-3-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-4yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-4-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-5yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-5-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-6yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-6-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
              - {key: "bench-affinity-7yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/affinity-7-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: In, values: ["v"]}
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-topology-0yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/topology-0-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-topology-1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/topology-1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-topology-2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/topology-2-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-topology-3yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/topology-3-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-anti-0yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/anti-0-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-anti-1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/anti-1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-anti-2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/anti-2-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          - labelSelector: {matchLabels: {app: kausa-no-such-pod}}
            topologyKey: "bench-anti-3yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/anti-3-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      tolerations:
      - {key: "bench-toleration-0yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-0-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-1yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-2-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-3yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-3-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-4yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-4-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-5yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-5-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-6yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-6-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      - {key: "bench-toleration-7yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy.example/toleration-7-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", operator: Exists, effect: NoSchedule}
      containers:
      - name: app
        image: busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sleep", "3600"]
        resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {cpu: 50m, memory: 32Mi}}
