# Seeded failures for the end-to-end test. All three use kausa's own image, already loaded into
# the kind cluster, with an argument it refuses (exit code 2), so the test pulls no other image:
# crasher crash-loops (D001), failing-job fails (D008) and stranded cannot be scheduled (D005).
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: e2e-shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: crasher}
  template:
    metadata:
      labels: {app: crasher}
    spec:
      containers:
        - name: app
          image: kausa:e2e
          imagePullPolicy: Never
          args: ["--no-such-flag"]
          # The D001 request must carry the probe path without its query. The one-hour delay means
          # the kubelet never probes the crashing container, so no Unhealthy note quotes the full
          # URL and no D006 incident opens.
          readinessProbe:
            httpGet:
              path: "/e2e-ready?e2e-query=e2e-query-value"
              port: 8080
            initialDelaySeconds: 3600
---
apiVersion: batch/v1
kind: Job
metadata:
  name: failing-job
  namespace: e2e-shop
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: kausa:e2e
          imagePullPolicy: Never
          args: ["--no-such-flag"]
---
# No node has the label, so the Pod stays Pending and Unschedulable (D005). The D005 request must
# carry the selector and toleration keys, never their values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stranded
  namespace: e2e-shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: stranded}
  template:
    metadata:
      labels: {app: stranded}
    spec:
      nodeSelector:
        example.com/e2e-pool: e2e-pool-value
      tolerations:
        - key: example.com/e2e-taint
          operator: Equal
          value: e2e-toleration-value
          effect: NoSchedule
      containers:
        - name: app
          image: kausa:e2e
          imagePullPolicy: Never
          args: ["--no-such-flag"]
