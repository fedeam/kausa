# Values of the kausa chart. The full reference, with what each one turns into:
# docs/reference/helm-chart.md.

image:
  # The image published with each release, signed with cosign (docs/adr/0012-releases.md); to run
  # your own build, set the repository and the tag (docs/how-to/install-with-helm.md).
  repository: ghcr.io/fedeam/kausa
  # Defaults to the chart's appVersion.
  tag: ""
  # A digest (sha256:...) pins the image; it takes precedence over the tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

rbac:
  # Required, on every install and upgrade.
  # cluster: a ClusterRole and ClusterRoleBinding, and kausa reads every namespace.
  # namespaced: a Role and RoleBinding in each namespace below, nothing cluster-scoped, and kausa
  # watches only those namespaces.
  scope: ""
  # With scope namespaced: the namespaces kausa watches. Each must exist before helm install.
  namespaces: []

# The model endpoint. With no endpoint and no dryRun, kausa only logs incidents, and the chart
# grants neither pods/log nor the Event writes.
model:
  # An OpenAI-compatible base URL, for example https://api.openai.com/v1 or
  # http://ollama.ollama.svc:11434/v1. Each incident's redacted context is sent there.
  endpoint: ""
  # The model to ask (needed with an endpoint).
  name: ""
  # Allow a plain http:// endpoint: only for one in the cluster or on the same private network.
  allowHttp: false
  # Ask for structured output (response_format); turn off for servers that do not support it.
  jsonSchema: true
  # The API key, from a Secret you create (kausa never reads Secrets through the API: the kubelet
  # mounts this one as a file).
  apiKey:
    existingSecret: ""
    key: api-key

# Log the redacted request of each incident instead of sending it. No Event is written.
dryRun: false
# Read the last lines of the failed container for crash loops, out-of-memory kills and failed
# Jobs. false also removes pods/log from the ClusterRole or the Roles.
logs: true
# Write each explanation as an Event on the failing workload. false also removes the Event writes
# from the ClusterRole or the Roles.
events: true
history:
  # Keep the full explanations of each incident in an Explanation object in its namespace.
  # Needs an endpoint and dryRun false. false, no endpoint or dryRun true deletes the
  # CustomResourceDefinition, and with it every Explanation in the cluster.
  enabled: false
  # Delete history older than this many days (1-30).
  days: 7
  # Install the CustomResourceDefinition (and the reader role below). Set false when another
  # release or a cluster administrator installs it, for example in a namespaced install.
  installCRD: true
  readers:
    # Let the built-in view, edit and admin roles read Explanations, as they read Events.
    aggregate: true
# How long a failure must persist before it is an incident, in seconds (0-3600).
settleSeconds: 60
# The call and token budget, and how long an explanation is reused for a repeated incident.
budget:
  callsPerHour: 30
  callsPerDay: 200
  maxInputTokens: 6000
  dedupHours: 6

# Prometheus counters, /healthz and /readyz. When enabled, the probes use them and a Service
# exposes the port.
metrics:
  enabled: true
  port: 9090
  # The address to listen on. [::] accepts IPv4 and IPv6 on Linux, so the probes reach it on
  # single-stack and dual-stack clusters; use 0.0.0.0 on nodes booted with IPv6 turned off in the
  # kernel (ipv6.disable=1), where [::] cannot be bound.
  bindAddress: "[::]"
  service:
    type: ClusterIP
    annotations: {}

serviceAccount:
  # The name to use; defaults to the release's full name.
  name: ""
  annotations: {}

# Room above what was measured on a Raspberry Pi 4 in dry-run (2 MiB, 1m CPU, on a small cluster;
# docs/research/2026-10-26-resource-use-on-a-raspberry-pi.md), for larger clusters and for the
# explanation path.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Limit kausa's traffic with a NetworkPolicy: egress to DNS, the API server and the model
# endpoint only, and ingress to the metrics port only. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # The API server's addresses and port, as seen from Pods: `kubectl get endpointslices -n default
  # -l kubernetes.io/service-name=kubernetes`. Required when the policy is enabled.
  apiServer:
    cidrs: []
    port: 6443
  # NetworkPolicy peers (to:) and ports of the model endpoint, for example a podSelector and
  # namespaceSelector for one in the cluster, or an ipBlock for a hosted one. NetworkPolicy cannot
  # select a hostname.
  endpoint:
    to: []
    ports: []
  # NetworkPolicy peers (from:) allowed to reach the metrics port; empty allows any.
  metricsFrom: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
