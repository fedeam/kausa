{{- include "kausa.validate" . }}
# The permissions in docs/reference/permissions.md, and nothing else: no Secrets, no ConfigMaps, no
# wildcards, and no write but create and patch on Events (only when kausa writes them).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kausa.fullname" . }}
  labels:
    {{- include "kausa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  {{- if and .Values.logs (include "kausa.explains" .) }}
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["list", "watch"]
  {{- if include "kausa.writesEvents" . }}
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- end }}
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kausa.fullname" . }}
  labels:
    {{- include "kausa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kausa.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kausa.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
