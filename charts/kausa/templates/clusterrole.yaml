{{- include "kausa.validate" . }}
# The permissions in docs/reference/permissions.md, and nothing else: no Secrets, no ConfigMaps, no
# wildcards, and no write but create and patch on Events (only when kausa writes them).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kausa.fullname" . }}
  labels:
    {{- include "kausa.labels" . | nindent 4 }}
rules:
  {{- include "kausa.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kausa.fullname" . }}
  labels:
    {{- include "kausa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kausa.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kausa.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
