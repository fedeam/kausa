{{- /* rbac is read nil-safe, as in kausa.validate: rbac.yaml refuses a missing scope first. */}}
{{- $rbac := .Values.rbac | default dict }}
{{- $scope := $rbac.scope | default "" | toString }}
{{- $namespaces := $rbac.namespaces | default list }}
{{- /* The API key's volume and the notifications' share one volumes and one volumeMounts list. */}}
{{- $apiKey := and (or .Values.model.endpoint .Values.dryRun) .Values.model.apiKey.existingSecret }}
{{- $notifies := include "kausa.notifies" . }}
{{- $notify := .Values.notifications | default dict }}
{{- /* With two replicas, only the holder of the Lease acts (docs/adr/0019-high-availability.md). */}}
{{- $standby := eq (include "kausa.replicas" .) "2" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kausa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kausa.labels" . | nindent 4 }}
spec:
  {{- /*
  One replica, or two with leader election (replicaCount). Recreate stops the old Pods before the
  new ones start, so a rollout never runs two versions, and with two replicas only the holder of
  the Lease acts. The YAML comment below is kept as it was: it renders, and the one-replica
  Deployment renders byte for byte as before.
  */}}
  # One instance: Recreate stops the old Pod before the new one starts, so a rollout never runs
  # two (docs/reference/permissions.md, "The pod that runs kausa").
  replicas: {{ include "kausa.replicas" . }}
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "kausa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kausa.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kausa.serviceAccountName" . }}
      # kausa talks to the API server with this token.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Makes the API key file readable by kausa's group, and by no one else.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kausa
          image: {{ include "kausa.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            {{- if eq $scope "namespaced" }}
            {{- range $namespaces }}
            - --namespace
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if $standby }}
            - --leader-lease
            - {{ printf "%s/%s" .Release.Namespace (include "kausa.leaderLease" .) | quote }}
            {{- end }}
            - --settle-seconds
            - {{ int .Values.settleSeconds | quote }}
            {{- with .Values.model.endpoint }}
            - --endpoint
            - {{ . | quote }}
            {{- end }}
            {{- if or .Values.model.endpoint .Values.dryRun }}
            {{- with .Values.model.name }}
            - --model
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.model.allowHttp }}
            - --allow-http
            {{- end }}
            {{- if not .Values.model.jsonSchema }}
            - --no-json-schema
            {{- end }}
            {{- if .Values.model.apiKey.existingSecret }}
            - --api-key-file
            - /var/run/secrets/kausa/api-key
            {{- end }}
            - --max-calls-per-hour
            - {{ int .Values.budget.callsPerHour | quote }}
            - --max-calls-per-day
            - {{ int .Values.budget.callsPerDay | quote }}
            - --max-input-tokens
            - {{ int .Values.budget.maxInputTokens | quote }}
            - --dedup-hours
            - {{ int .Values.budget.dedupHours | quote }}
            {{- end }}
            {{- if .Values.dryRun }}
            - --dry-run
            {{- end }}
            {{- if not .Values.logs }}
            - --no-logs
            {{- end }}
            {{- if not (include "kausa.rollouts" .) }}
            - --no-rollouts
            {{- end }}
            {{- if not .Values.events }}
            - --no-events
            {{- end }}
            {{- if include "kausa.writesHistory" . }}
            - --history
            - --history-days
            - {{ include "kausa.historyDays" . | quote }}
            {{- end }}
            {{- if $notifies }}
            {{- $format := include "kausa.notifyFormat" . }}
            - --notify-url-file
            - /var/run/secrets/kausa-notify/url
            - --notify-format
            - {{ $format | quote }}
            {{- if eq $format "telegram" }}
            - --notify-telegram-chat-id
            - {{ include "kausa.notifyChatId" . | quote }}
            {{- end }}
            {{- if $notify.tokenKey }}
            - --notify-token-file
            - /var/run/secrets/kausa-notify/token
            {{- end }}
            {{- if $notify.allowHttp }}
            - --notify-allow-http
            {{- end }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-address
            - {{ printf "%s:%d" .Values.metrics.bindAddress (int .Values.metrics.port) | quote }}
            {{- end }}
          env:
            # The reporting instance of kausa's Events.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ int .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $apiKey $notifies }}
          volumeMounts:
            {{- if $apiKey }}
            - name: api-key
              mountPath: /var/run/secrets/kausa
              readOnly: true
            {{- end }}
            {{- if $notifies }}
            - name: notify
              mountPath: /var/run/secrets/kausa-notify
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $apiKey $notifies }}
      volumes:
        {{- if $apiKey }}
        - name: api-key
          secret:
            secretName: {{ .Values.model.apiKey.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.model.apiKey.key }}
                path: api-key
        {{- end }}
        {{- if $notifies }}
        {{- /* The webhook URL and the bearer token; never optional (docs/adr/0015-notifications.md). */}}
        - name: notify
          secret:
            secretName: {{ $notify.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $notify.urlKey | default "url" | quote }}
                path: url
              {{- with $notify.tokenKey }}
              - key: {{ . | quote }}
                path: token
              {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $standby (not .Values.affinity) }}
      {{- /*
      Spreads the two replicas over nodes when it can; preferred, not required, so that a one-node
      cluster still runs both. Any affinity in the values replaces it.
      */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "kausa.selectorLabels" . | nindent 20 }}
      {{- end }}
