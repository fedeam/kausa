[package]
name = "kausa"
# Pre-release of the planned v0.1: detection runs (first weekend); nothing is released yet.
version = "0.1.0-dev"
edition = "2024"
# Minimum supported Rust version: the toolchain pinned in rust-toolchain.toml when this was
# written. It can stay behind when the toolchain moves on (clippy's incompatible_msrv lint, part
# of the CI's -D warnings, flags code that needs a newer compiler).
rust-version = "1.99"
description = "A tiny, read-only Kubernetes controller that explains failing workloads with an LLM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedeam/kausa"
readme = "README.md"
keywords = ["kubernetes", "controller", "llm", "troubleshooting", "kube"]
categories = ["development-tools"]
# Not on crates.io until the name is reserved deliberately.
publish = false

# Every dependency needs a reason (see AGENTS.md) and must pass `cargo deny --locked check`.
[dependencies]
# Kubernetes client and watchers. rustls with ring for TLS (no OpenSSL); no default features, so
# nothing else is compiled in (docs/adr/0002-rust-and-dual-license.md).
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime"] }
# The Kubernetes API types. The oldest API version this release supports: kausa uses only stable
# APIs (core/v1 Pods, events.k8s.io/v1 Events, apps/v1, batch/v1), which newer servers keep.
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_32"] }
# The async runtime: one thread is enough for a controller that waits on watches.
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "signal", "time"] }
# Stream combinators for the watchers.
futures = { version = "0.3.34", default-features = false, features = ["std"] }
# kausa's log lines and the requests to the model are JSON.
serde_json = "1.0.154"
# The redaction patterns: a linear-time engine, so hostile text cannot make a pattern take
# exponential time.
regex = "1.13.1"
# The model's answers are normalized to NFC before they are validated.
unicode-normalization = "0.1.26"
# The client for the OpenAI-compatible endpoint, with rustls and no crypto provider of its own:
# kausa installs ring, the provider the Kubernetes client already uses. No default features, so no
# native TLS; the client is built with `no_proxy()`, so no proxy from the environment either.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[lints.rust]
unsafe_code = "forbid"
