name: e2e

# The end-to-end test (tests/e2e/run.sh): kausa's image and Helm chart in a kind cluster, against a
# fake model endpoint, with seeded failures. Like ci.yml, it does not start while the repository is
# private and the account's included minutes are used up (docs/index.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Pinned tools, each checked against a SHA-256 before it is installed; bumped by hand, like
      # the Dockerfile's (docs/how-to/maintain.md). kind: the checksums published next to each
      # binary in https://github.com/kubernetes-sigs/kind/releases. helm: the same version and
      # checksum as the Dockerfile's ci target.
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      # The node image of the kind release above, by digest, as its release notes list it.
      KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind and helm
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  /tmp/kind" | sha256sum -c -
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          kind version
          helm version --short
          kubectl version --client

      - name: Run the end-to-end test
        run: tests/e2e/run.sh
